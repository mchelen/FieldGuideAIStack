name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Graph integrity: dangling prose links, orphans, uncited products.
      - name: Validate graph
        run: npm run validate

      # Capabilities a product page describes but never declares. Command
      # execution and memory both went missing this way, found by a person
      # noticing rather than by anything checking.
      - name: Check capability coverage
        run: npm run check:gaps

      # Coverage against the concept inventory. Informational, but it belongs in
      # the log so the number is visible rather than only on request.
      - name: Concept coverage
        run: npm run backlog

      # The content schema is enforced by the build itself -- a bad frontmatter
      # field or a relation pointing at a node that does not exist fails here.
      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      # A green build only proves nothing threw. This asserts the build-time
      # transforms actually ran -- cross-links rewritten, diagrams generated,
      # graph payload emitted -- so a dependency bump cannot quietly remove
      # them while CI stays green.
      - name: Check built output
        run: npm run check:output

      # Advisory on PRs. The scheduled job is the one that escalates.
      - name: Freshness
        run: npm run check:freshness
