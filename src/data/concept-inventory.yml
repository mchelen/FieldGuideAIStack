# Concept inventory
#
# The backlog of terms this guide intends to cover, so coverage is a tracked
# number rather than a matter of whoever happened to think of something. A term
# lands here first and becomes a node page later, because a page has to carry
# sources and this list does not.
#
# `attestedBy` is computed, not asserted: it records which public glossaries
# were found to carry the term when the inventory was compiled. Eight sources,
# all read 2026-08-22:
#
#   google-ml     developers.google.com/machine-learning/glossary (incl. the
#                 generative section, which is part of the same publication and
#                 is therefore not counted separately)
#   wikipedia     en.wikipedia.org/wiki/Glossary_of_artificial_intelligence
#                 and Outline_of_artificial_intelligence
#   claude-code   code.claude.com/docs/en/glossary
#   anthropic     platform.claude.com/docs/en/about-claude/glossary
#   hf            huggingface.co/docs/transformers/glossary
#   mistral       docs.mistral.ai/getting-started/glossary
#   promptguide   promptingguide.ai/techniques
#   outline       Wikipedia outline of AI
#
# An empty list means no surveyed glossary carries the term, which is common
# for the applied stack and is a signal about how new the vocabulary is rather
# than a mark against it.
#
# Run `npm run backlog` for coverage.

