<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="The AI stack top to bottom: surface, harness, inference API, model, with the agentic loop returning from model to harness."><rect width="1600" height="900" fill="#fbfaf7"/><text x="56" y="52" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="30" font-weight="700" fill="#1c1a17" text-anchor="start">The AI stack, top to bottom</text><text x="56" y="76" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="15" font-weight="400" fill="#55504a" text-anchor="start">One request, and every layer it passes through</text><text x="1544" y="52" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="13" font-weight="700" fill="#7a4a1e" text-anchor="end" letter-spacing="1.6">FIELD GUIDE TO THE AI STACK</text><text x="1544" y="74" font-family='"Liberation Mono", "SFMono-Regular", Menlo, monospace' font-size="13" font-weight="400" fill="#85807a" text-anchor="end">mchelen.github.io/FieldGuideAIStack</text><line x1="56" y1="94" x2="1544" y2="94" stroke="#ded8ce" stroke-width="1"/><path d="M158 208 H172 V638 H158" fill="none" stroke="#7a4a1e" stroke-width="2" stroke-linecap="round"/><text x="56" y="224" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="16" font-weight="700" fill="#7a4a1e" text-anchor="start" letter-spacing="1.8">AGENT</text><text x="56" y="246" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="11" font-weight="400" fill="#85807a" text-anchor="start">a model driven in</text><text x="56" y="261.95" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="11" font-weight="400" fill="#85807a" text-anchor="start">a loop by a</text><text x="56" y="277.9" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="11" font-weight="400" fill="#85807a" text-anchor="start">harness, with</text><text x="56" y="293.85" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="11" font-weight="400" fill="#85807a" text-anchor="start">tools</text><rect x="194" y="118" width="1264" height="70" rx="8" fill="#ffffff" stroke="#ded8ce" stroke-width="1"/><text x="216" y="148" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="16" font-weight="700" fill="#1c1a17" text-anchor="start" letter-spacing="1.4">SURFACE</text><text x="216" y="167" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="11.5" font-weight="400" fill="#85807a" text-anchor="start">where you meet it</text><text x="444" y="145" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="14" font-weight="400" fill="#55504a" text-anchor="start">Terminal, IDE, desktop app, chat window. The front end — not the engine underneath.</text><text x="1436" y="148" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="10.5" font-weight="700" fill="#7a4a1e" text-anchor="end" letter-spacing="1.3">ONE ENGINE, SEVERAL FACES</text><rect x="194" y="208" width="1264" height="178" rx="8" fill="#ffffff" stroke="#ded8ce" stroke-width="1"/><text x="216" y="238" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="16" font-weight="700" fill="#1c1a17" text-anchor="start" letter-spacing="1.4">HARNESS</text><text x="216" y="257" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="11.5" font-weight="400" fill="#85807a" text-anchor="start">the program around the model</text><text x="444" y="235" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="14" font-weight="400" fill="#55504a" text-anchor="start">Assembles the context, calls the model, executes the tools the model asks for, and decides what happens next.</text><text x="1436" y="238" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="10.5" font-weight="700" fill="#7a4a1e" text-anchor="end" letter-spacing="1.3">WHERE THE PRODUCT LIVES</text><rect x="216" y="286" width="235.2" height="80" rx="6" fill="#fbfaf7" stroke="#ded8ce" stroke-width="1"/><text x="228" y="306" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="12.5" font-weight="700" fill="#1c1a17" text-anchor="start">Prompt engineering</text><text x="228" y="322" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="11" font-weight="400" fill="#85807a" text-anchor="start">Change behaviour by changing what you</text><text x="228" y="337.4" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="11" font-weight="400" fill="#85807a" text-anchor="start">send. No training involved.</text><rect x="462.2" y="286" width="235.2" height="80" rx="6" fill="#fbfaf7" stroke="#ded8ce" stroke-width="1"/><text x="474.2" y="306" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="12.5" font-weight="700" fill="#1c1a17" text-anchor="start">Context engineering</text><text x="474.2" y="322" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="11" font-weight="400" fill="#85807a" text-anchor="start">What goes in the window, what gets</text><text x="474.2" y="337.4" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="11" font-weight="400" fill="#85807a" text-anchor="start">dropped, what gets fetched again.</text><rect x="708.4" y="286" width="235.2" height="80" rx="6" fill="#fbfaf7" stroke="#ded8ce" stroke-width="1"/><text x="720.4" y="306" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="12.5" font-weight="700" fill="#1c1a17" text-anchor="start">Retrieval (RAG)</text><text x="720.4" y="322" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="11" font-weight="400" fill="#85807a" text-anchor="start">Fetch the document at question time so</text><text x="720.4" y="337.4" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="11" font-weight="400" fill="#85807a" text-anchor="start">the answer rests on it.</text><rect x="954.5999999999999" y="286" width="235.2" height="80" rx="6" fill="#fbfaf7" stroke="#ded8ce" stroke-width="1"/><text x="966.5999999999999" y="306" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="12.5" font-weight="700" fill="#1c1a17" text-anchor="start">Tool use</text><text x="966.5999999999999" y="322" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="11" font-weight="400" fill="#85807a" text-anchor="start">The model asks for a function. Your</text><text x="966.5999999999999" y="337.4" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="11" font-weight="400" fill="#85807a" text-anchor="start">code decides whether to run it.</text><rect x="1200.8" y="286" width="235.2" height="80" rx="6" fill="#fbfaf7" stroke="#ded8ce" stroke-width="1"/><text x="1212.8" y="306" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="12.5" font-weight="700" fill="#1c1a17" text-anchor="start">Approval mode</text><text x="1212.8" y="322" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="11" font-weight="400" fill="#85807a" text-anchor="start">Which actions need a human before they</text><text x="1212.8" y="337.4" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="11" font-weight="400" fill="#85807a" text-anchor="start">land.</text><rect x="194" y="406" width="1264" height="70" rx="8" fill="#ffffff" stroke="#ded8ce" stroke-width="1"/><text x="216" y="436" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="16" font-weight="700" fill="#1c1a17" text-anchor="start" letter-spacing="1.4">INFERENCE API</text><text x="216" y="455" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="11.5" font-weight="400" fill="#85807a" text-anchor="start">the call itself</text><text x="444" y="433" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="14" font-weight="400" fill="#55504a" text-anchor="start">Stateless HTTP. The whole conversation is re-sent every time, and the server keeps nothing between calls.</text><text x="1436" y="436" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="10.5" font-weight="700" fill="#7a4a1e" text-anchor="end" letter-spacing="1.3">STATELESS</text><rect x="194" y="496" width="1264" height="142" rx="8" fill="#ffffff" stroke="#ded8ce" stroke-width="1"/><text x="216" y="526" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="16" font-weight="700" fill="#1c1a17" text-anchor="start" letter-spacing="1.4">MODEL</text><text x="216" y="545" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="11.5" font-weight="400" fill="#85807a" text-anchor="start">the trained artifact</text><text x="444" y="523" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="14" font-weight="400" fill="#55504a" text-anchor="start">An architecture plus learned weights, mapping input tokens to output token probabilities. No memory, no tools, cannot</text><text x="444" y="544" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="14" font-weight="400" fill="#55504a" text-anchor="start">act.</text><text x="1436" y="526" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="10.5" font-weight="700" fill="#7a4a1e" text-anchor="end" letter-spacing="1.3">A FILE, NOT A SERVICE</text><rect x="216" y="570" width="604.5" height="48" rx="6" fill="#fbfaf7" stroke="#ded8ce" stroke-width="1"/><text x="228" y="590" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="12.5" font-weight="700" fill="#1c1a17" text-anchor="start">Token</text><text x="228" y="606" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="11" font-weight="400" fill="#85807a" text-anchor="start">The unit it reads, emits, and is billed in. A word fragment, not a word.</text><rect x="831.5" y="570" width="604.5" height="48" rx="6" fill="#fbfaf7" stroke="#ded8ce" stroke-width="1"/><text x="843.5" y="590" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="12.5" font-weight="700" fill="#1c1a17" text-anchor="start">Context window</text><text x="843.5" y="606" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="11" font-weight="400" fill="#85807a" text-anchor="start">A per-call ceiling on what it can attend to. Not a memory.</text><path d="M256 191 V199" stroke="#7a4a1e" stroke-width="1.6"/><path d="M251 198 L256 205 L261 198 Z" fill="#7a4a1e"/><path d="M256 389 V397" stroke="#7a4a1e" stroke-width="1.6"/><path d="M251 396 L256 403 L261 396 Z" fill="#7a4a1e"/><path d="M256 479 V487" stroke="#7a4a1e" stroke-width="1.6"/><path d="M251 486 L256 493 L261 486 Z" fill="#7a4a1e"/><path d="M1458 522 H1492 V360 H1466" fill="none" stroke="#2f5d3f" stroke-width="1.6" stroke-dasharray="5 4" stroke-linejoin="round"/><path d="M1467 355 L1459 360 L1467 365 Z" fill="#2f5d3f"/><g transform="translate(1509 441) rotate(90)"><text x="0" y="0" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="11" font-weight="700" fill="#2f5d3f" text-anchor="middle" letter-spacing="1.3">AGENTIC LOOP</text></g><g transform="translate(1524 441) rotate(90)"><text x="0" y="0" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="10" font-weight="400" fill="#85807a" text-anchor="middle">repeat until done</text></g><line x1="56" y1="668" x2="537.3333333333333" y2="668" stroke="#ded8ce"/><text x="56" y="691" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="11" font-weight="700" fill="#7a4a1e" text-anchor="start" letter-spacing="1.5">WHO IS INVOLVED</text><text x="56" y="713" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="13" font-weight="700" fill="#1c1a17" text-anchor="start">Model provider</text><text x="56" y="730" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="11.5" font-weight="400" fill="#55504a" text-anchor="start">Trains it, owns the weights, sets the licence.</text><text x="56" y="758.33" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="13" font-weight="700" fill="#1c1a17" text-anchor="start">Model host</text><text x="56" y="775.33" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="11.5" font-weight="400" fill="#55504a" text-anchor="start">Runs someone else’s model and sells access.</text><line x1="559.3333333333333" y1="668" x2="1040.6666666666665" y2="668" stroke="#ded8ce"/><text x="559.3333333333333" y="691" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="11" font-weight="700" fill="#7a4a1e" text-anchor="start" letter-spacing="1.5">WHAT GOES WRONG</text><text x="559.3333333333333" y="713" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="13" font-weight="700" fill="#1c1a17" text-anchor="start">Hallucination</text><text x="559.3333333333333" y="730" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="11.5" font-weight="400" fill="#55504a" text-anchor="start">Confident, plausible, wrong — and indistinguishable from correct output, because</text><text x="559.3333333333333" y="746.33" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="11.5" font-weight="400" fill="#55504a" text-anchor="start">truth is not a quantity the model computes.</text><line x1="1062.6666666666665" y1="668" x2="1543.9999999999998" y2="668" stroke="#ded8ce"/><text x="1062.6666666666665" y="691" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="11" font-weight="700" fill="#7a4a1e" text-anchor="start" letter-spacing="1.5">HOW YOU KNOW</text><text x="1062.6666666666665" y="713" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="13" font-weight="700" fill="#1c1a17" text-anchor="start">Evaluation</text><text x="1062.6666666666665" y="730" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="11.5" font-weight="400" fill="#55504a" text-anchor="start">A repeatable test. The only thing that turns “it seems better” into a claim</text><text x="1062.6666666666665" y="746.33" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="11.5" font-weight="400" fill="#55504a" text-anchor="start">someone else can check.</text><rect x="56" y="820" width="1488" height="50" rx="8" fill="#f3ebe0" stroke="#f3ebe0" stroke-width="1"/><text x="800" y="851" font-family='"Liberation Sans", "Helvetica Neue", Helvetica, Arial, sans-serif' font-size="15" font-weight="600" fill="#7a4a1e" text-anchor="middle">Almost everything people attribute to “the AI” — that it remembers, searches, runs code, asks permission — belongs to the harness, not the model.</text></svg>